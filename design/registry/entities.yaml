# Product Glossary & Business-Fact Registry
#
# PURPOSE: Single source of truth for the named product facts that appear in more
# than one PRD — domain terms, plans, business rules, constants and events. Skills
# read it before writing so that a price, a limit or a term defined in one PRD is
# not contradicted by another at authoring time.
#
# RULES:
#   - Register only facts that cross feature boundaries. A rule or constant used by
#     one PRD only stays in that PRD; register it when a second PRD references it.
#   - Never delete an entry — set status: deprecated instead.
#   - When a value changes: update the value, set revised: to today's date, and add
#     a comment with the old value and the PRD that changed it.
#   - source: is the authoritative PRD (design/prd/<slug>.md) — the one that owns
#     the fact. PRDs that use it list themselves under referenced_by:.
#   - When another PRD starts using an existing entry, append its path to
#     referenced_by:. Never create a second entry for the same fact.
#   - Prices are integer KRW (no minor unit) and say whether VAT is included.
#
# WRITTEN BY: /write-prd (after the PRD's sections are approved, asking first)
#             /consistency-check (when resolving conflicts, stale or missing entries)
# READ BY:    /write-prd (before authoring, and after Functional Requirements and
#               Business Rules & Calculations are written, to conflict-check them)
#             /consistency-check (primary input — grep the registry first, then PRDs)
#             /review-all-prds (baseline for the cross-PRD consistency pass)
#             /prd-review (cross-document facts, instead of reading sibling PRDs)
#             /propagate-prd-change (downstream PRDs through referenced_by)
#             /business-rules-check (plans, rules and constants as intended values)
#             /feature-audit (events, cross-checked against the tracking plan)
#             /team-content (terminology, through the DD-CONTENT-VOICE gate)
#
# SEARCH PATTERNS (for skills using Grep):
#   Every entry name:          Grep pattern="^  - name:" path="design/registry/entities.yaml"
#   One entry:                 Grep pattern="^  - name: free_active_goal_limit$" path="design/registry/entities.yaml"
#   What goals.md owns:        Grep pattern="source: design/prd/goals.md" path="design/registry/entities.yaml"
#   What notifications.md uses: Grep pattern="^      - design/prd/notifications.md" path="design/registry/entities.yaml"
#   Every KRW amount:          Grep pattern="unit: KRW" path="design/registry/entities.yaml"
#   Deprecated entries:        Grep pattern="status: deprecated" path="design/registry/entities.yaml"
#   Match live entries only — every example below is a comment line starting with "#".
#
# FORMAT: YAML, block style. Indentation is a grep contract, never reformat:
#   section key at column 0; each entry starts with exactly two spaces then
#   "- name:"; entry fields at four spaces; referenced_by: is a block list whose
#   items sit at six spaces ("      - design/prd/<slug>.md").
#   Sections: entities | plans | rules | constants | events
#   Every entry: name, status, source, referenced_by, added, revised — plus the
#   section's own fields listed above each section.

version: 1
last_updated: ""

# ─── ENTITIES ────────────────────────────────────────────────────────────────
# Domain terms: the nouns users and the team use for the product's things
# (goal, deposit, mandate, workspace, member). Registering a term fixes its
# meaning and its wording in every language the product ships, so PRDs, UI copy,
# notifications and help-center articles all say the same thing.
#
# Fields: name, status, source, referenced_by, definition, term_ko (the Korean
#   term used in the product), avoid (terms not to use for it), added, revised

entities: []

# Example (remove when the first real entry is added):
#
# entities:
#   - name: goal
#     status: active              # active | deprecated
#     source: design/prd/goals.md
#     referenced_by:
#       - design/prd/goals.md
#       - design/prd/payments.md
#       - design/prd/notifications.md
#     definition: "A named savings target with an amount and a date that Moa deposits toward automatically."
#     term_ko: "목표"
#     avoid:
#       - savings plan
#       - piggy bank
#     added: 2026-10-05
#     revised: ""


# ─── PLANS ───────────────────────────────────────────────────────────────────
# Subscription plans, credit packs and anything else a user buys or is entitled
# to. The full pricing picture (promotions, taxes, refunds) lives in
# design/product/pricing-model.md; this section holds the plan facts other PRDs
# depend on. Prices point at constants so a price has exactly one home.
#
# Fields: name, status, source, referenced_by, display_name,
#   monthly_price_constant, annual_price_constant, entitlements (list), added, revised

plans: []

# Example:
#
# plans:
#   - name: free
#     status: active
#     source: design/prd/subscription.md
#     referenced_by:
#       - design/prd/subscription.md
#       - design/prd/goals.md
#     display_name: Free
#     monthly_price_constant: ""
#     annual_price_constant: ""
#     entitlements:
#       - active_goals_up_to_free_active_goal_limit
#       - weekly_auto_debit
#     added: 2026-10-05
#     revised: ""
#
#   - name: plus
#     status: active
#     source: design/prd/subscription.md
#     referenced_by:
#       - design/prd/subscription.md
#       - design/prd/goals.md          # the upgrade sheet shown at the goal limit
#       - design/prd/admin-console.md  # support view shows the user's plan
#     display_name: Plus
#     monthly_price_constant: plus_monthly_price
#     annual_price_constant: plus_annual_price
#     entitlements:
#       - unlimited_active_goals
#       - daily_auto_debit
#       - progress_insights
#     added: 2026-10-05
#     revised: ""


# ─── RULES ───────────────────────────────────────────────────────────────────
# Named business rules and calculations whose result another feature consumes,
# or that another PRD cites by name — fees, limits, eligibility, proration,
# rounding. The full rule (variable table, worked example, boundary cases) stays
# in the owning PRD's "## Business Rules & Calculations"; this entry is the index.
#
# Fields: name, status, source, referenced_by, variables (list), unit, rounding,
#   output_range [min, max], expression (optional), notes (optional), added, revised

rules: []

# Example:
#
# rules:
#   - name: suggested_debit_amount
#     status: active
#     source: design/prd/goals.md
#     referenced_by:
#       - design/prd/goals.md
#       - design/prd/onboarding.md    # onboarding shows the suggestion on the first goal
#       - design/prd/payments.md      # payments schedules debits of this amount
#     variables:
#       - target_amount
#       - saved_amount
#       - remaining_debits
#     unit: KRW
#     rounding: "up to the nearest KRW 10, once, on the result"
#     output_range: [0, target_amount]
#     expression: "ceil((target_amount - saved_amount) / remaining_debits / 10) * 10"
#     notes: "No suggestion when no debit date is left before the target date."
#     added: 2026-10-05
#     revised: ""


# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named values that one PRD defines and another must agree with: plan limits,
# prices, quotas, time windows. The value used at run time lives in config or a
# feature flag (the owning PRD's "## Configuration & Flags" names the key); this
# entry is the agreed product value.
#
# Fields: name, status, source, referenced_by, value, unit, config_key (optional),
#   added, revised

constants: []

# Example:
#
# constants:
#   - name: free_active_goal_limit
#     status: active
#     source: design/prd/subscription.md
#     referenced_by:
#       - design/prd/subscription.md
#       - design/prd/goals.md         # goal creation is blocked at the limit
#     value: 3
#     unit: goals
#     config_key: entitlements.free.active_goal_limit
#     added: 2026-10-05
#     revised: ""
#
#   - name: plus_monthly_price
#     status: active
#     source: design/prd/subscription.md
#     referenced_by:
#       - design/prd/subscription.md
#       - design/prd/goals.md
#     value: 4900
#     unit: KRW per month, VAT included
#     added: 2026-10-05
#     revised: ""
#
#   - name: plus_annual_price
#     status: active
#     source: design/prd/subscription.md
#     referenced_by:
#       - design/prd/subscription.md
#     value: 49000
#     unit: KRW per year, VAT included
#     added: 2026-10-05
#     revised: ""


# ─── EVENTS ──────────────────────────────────────────────────────────────────
# Named events that more than one PRD relies on: domain events one feature
# publishes and another consumes (payment_settled), and analytics events that
# two PRDs cite. The full analytics catalogue is design/product/tracking-plan.md;
# register an event here when a second PRD depends on its name or payload.
#
# Fields: name, status, source, referenced_by, kind (domain | analytics),
#   trigger, properties (list), added, revised

events: []

# Example:
#
# events:
#   - name: payment_settled
#     status: active
