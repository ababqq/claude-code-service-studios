# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER features or services must be
#     built. An internal implementation detail that affects only one ADR does not
#     need to be registered.
#   - Never delete entries — set status: "superseded_by: ADR-NNNN" instead
#     (quoted: an unquoted second colon is not valid YAML).
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Step 5.7 — after the ADR is written; acceptance
#             mode marks superseded entries — asks first)
#             /data-model (model mode — syncs data_ownership; asks first)
# READ BY:    /architecture-decision (Step 3a — before authoring; conflict check)
#             /create-architecture (Phase 2c)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /map-features (passes this path to the TD-DOMAIN-BOUNDARY gate)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All data owners:          Grep pattern="^  - entity:" path="docs/registry/architecture.yaml"
#   Who owns savings_goal:    Grep pattern="entity: savings_goal"
#   All event contracts:      Grep pattern="style: event"
#   All webhook contracts:    Grep pattern="style: webhook"
#   Budget for an operation:  Grep pattern="operation: \"POST /v1/goals"
#   All technology choices:   Grep pattern="^  - purpose:"
#   All forbidden patterns:   Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:       Grep pattern="status: \"?superseded"

version: 1
last_updated: ""

# ─── DATA OWNERSHIP ──────────────────────────────────────────────────────────
# Which service or module is the authoritative owner (the only writer) of each
# shared entity or field.
# Conflicts: two ADRs claiming to own the same entity = lost updates, a split
# source of truth, and reconciliation jobs nobody planned.
#
# Register an entity when it is READ or WRITTEN by more than one feature or
# service. Entities used by a single module only do not need to be registered.
#
# Required fields: entity, owner, adr, access, referenced_by[], added
# owner: the service or module that owns the table(s) and is the only writer.
# access: how other features read or change it (owner's API operation, published
#   event, read replica / view) — this is the contract other ADRs depend on.
# classification: public | internal | confidential | pii (align with
#   docs/data/data-model.md ## Data Classification when it exists).

data_ownership: []

# Example:
#
# data_ownership:
#   - entity: savings_goal
#     status: active            # active | "superseded_by: ADR-NNNN"
#     owner: goals              # module in apps/api
#     adr: docs/architecture/adr-0003-goals-domain-model.md
#     access: "Read via GET /v1/goals and GET /v1/goals/{goalId}; changes via the goals API only; other modules subscribe to goal.* events"
#     write_access: owner-only  # only the owner writes; others read or call its API
#     classification: internal
#     referenced_by:
#       - docs/architecture/adr-0003-goals-domain-model.md
#       - docs/architecture/adr-0004-payments-auto-debit.md   # reads goal status before charging
#       - docs/architecture/adr-0006-notifications.md         # consumes goal.completed
#     added: 2026-10-06
#     revised: ""
#
#   - entity: user_account
#     status: active
#     owner: auth
#     adr: docs/architecture/adr-0001-identity-and-auth.md
#     access: "Profile via GET /v1/me; identity and sessions only through the auth module"
#     write_access: owner-only
#     classification: pii        # email, phone number, Kakao/Naver/Apple subject IDs
#     referenced_by:
#       - docs/architecture/adr-0001-identity-and-auth.md
#     added: 2026-10-06
#     revised: ""


# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How features and services are required to communicate with each other.
# Conflicts: one ADR expects an event, another expects a synchronous call =
# integration bug, duplicated side effects or a hidden availability dependency.
#
# Register a contract when the communication style between two features or
# services is explicitly decided in an ADR and others must follow the same style.
#
# style options: rest | graphql | grpc | event | queue | webhook
# schema_ref: where the contract is specified — an OpenAPI path
#   (docs/api/openapi.yaml#/paths/...), a GraphQL type, a .proto message or an
#   AsyncAPI channel. A contract with no schema_ref is not yet reviewable.
# Events and queues name one publisher and its consumers.

interfaces: []

# Example:
#
# interfaces:
#   - contract: goal_completed
#     status: active
#     style: event              # at-least-once, via the transactional outbox
#     publisher: goals
#     consumers:
#       - notifications         # sends the push and the 알림톡
#       - analytics             # records goal_completed for the tracking plan
#     schema_ref: docs/api/asyncapi.yaml#/channels/goal.completed
#     idempotency: "Consumers de-duplicate on event_id"
#     adr: docs/architecture/adr-0006-notifications.md
#     referenced_by:
#       - docs/architecture/adr-0003-goals-domain-model.md
#       - docs/architecture/adr-0006-notifications.md
#     added: 2026-10-06
#     revised: ""
#
#   - contract: toss_payments_billing_result
#     status: active
#     style: webhook            # inbound from Toss Payments
#     publisher: toss-payments
#     consumers:
#       - payments
#     schema_ref: docs/api/openapi.yaml#/webhooks/tossPaymentsBillingResult
#     idempotency: "Deduplicate on the provider payment key; verify before applying"
#     adr: docs/architecture/adr-0004-payments-auto-debit.md
#     referenced_by:
#       - docs/architecture/adr-0004-payments-auto-debit.md
#     added: 2026-10-06
#     revised: ""


# ─── SLO BUDGETS ──────────────────────────────────────────────────────────────
# Latency, error-rate and availability allocations per operation or journey,
# against the targets in docs/ops/slo.md and the performance.* keys of
# project.yaml.
# Conflicts: allocations along one critical user journey that sum to more than
# the journey's SLO = a budget no implementation can meet.
#
# Register a budget when an ADR explicitly claims a latency or availability
# allocation. The registry lets /architecture-review verify that the allocations
# on a journey fit inside its SLO.

slo_budgets: []

# Example:
#
# slo_budgets:
#   - journey: make_a_deposit     # from docs/ops/slo.md ## Critical User Journeys
#     status: active
#     p95_ms: 800
#     availability_pct: 99.9
#     adr: docs/architecture/adr-0005-performance-and-slos.md
#     added: 2026-10-06
#     revised: ""
#
#   - operation: "POST /v1/goals/{goalId}/deposits"
#     journey: make_a_deposit
#     status: active
#     p95_ms: 600               # includes a 350 ms allocation for the Toss Payments call
#     error_rate_pct: 0.5
#     adr: docs/architecture/adr-0004-payments-auto-debit.md
#     notes: "Validation, idempotency check, provider call and ledger write"
#     referenced_by:
#       - docs/architecture/adr-0004-payments-auto-debit.md
#     added: 2026-10-06
#     revised: ""


# ─── TECHNOLOGY DECISIONS ────────────────────────────────────────────────────
# Which library, service or mechanism is chosen for which purpose across the
# project.
# Conflicts: two ADRs choosing different tools for the same purpose = two
# implementations to secure, operate and pay for, and code that breaks when one
# feature expects the other's behaviour.
#
# Register a decision when the choice is non-obvious and other ADRs might make a
# different choice for the same purpose without knowing this was decided.
# Adopt / Hold status of libraries lives in docs/architecture/tech-radar.md;
# this section records the binding purpose → choice mapping.

technology_decisions: []

# Example:
#
# technology_decisions:
#   - purpose: session_tokens
#     status: active
#     choice: "Short-lived JWT access token (15 min) + rotating opaque refresh token stored server-side"
#     not: "Long-lived JWT access tokens"   # explicitly rejected for this purpose
#     adr: docs/architecture/adr-0001-identity-and-auth.md
#     reason: "Revocation on logout and device loss; refresh reuse detection"
#     referenced_by:
#       - docs/architecture/adr-0001-identity-and-auth.md
#       - docs/architecture/adr-0007-mobile-offline-sync.md
#     added: 2026-10-06
#     revised: ""
#
#   - purpose: background_jobs
#     status: active
#     choice: "BullMQ on Redis 7"
#     not: "In-process timers (setTimeout / cron inside API pods)"
#     adr: docs/architecture/adr-0004-payments-auto-debit.md
#     reason: "Retries with backoff, visibility of failed auto-debits, survives deploys"
#     referenced_by:
#       - docs/architecture/adr-0004-payments-auto-debit.md
#     added: 2026-10-06
#     revised: ""


# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).
# /create-control-manifest turns these, with the tech radar's ## Forbidden
# Patterns, into Never rules.

forbidden_patterns: []

# Example:
#
# forbidden_patterns:
#   - pattern: cross_module_table_access
#     status: active
#     description: "A module must never read or write another module's tables
#       directly. Call the owner's API or consume its events instead."
#     why: "Direct table access bypasses the owner's invariants and authorization,
#       and turns every schema change into a cross-team migration."
#     adr: docs/architecture/adr-0003-goals-domain-model.md
#     added: 2026-10-06
#
#   - pattern: pii_in_logs
#     status: active
#     description: "Never write email addresses, phone numbers, bank account
#       numbers or access tokens to application logs, traces or analytics events."
#     why: "Logs are retained and widely readable; PII there breaks the retention
#       and access rules of the data classification and of PIPA."
#     adr: docs/architecture/adr-0001-identity-and-auth.md
#     added: 2026-10-06
