# Technical Requirement ID Registry
#
# PURPOSE: Persistent, stable IDs for every PRD technical requirement.
# Prevents TR-ID renumbering across /architecture-review runs, which would
# break story references.
#
# RULES:
#   - IDs are PERMANENT. Never renumber, never delete (use status: deprecated).
#   - Append-only: add new entries only at the END of each feature's list.
#   - When a PRD requirement is reworded (same intent): update `requirement`
#     text and add a `revised` date. The ID stays the same.
#   - When a requirement is removed from the PRD: set status: deprecated.
#   - When a requirement is split or replaced: set status to superseded-by with
#     the new TR-ID(s), quoted (see STATUS VALUES).
#
# WRITTEN BY: /architecture-review — the ONLY writer (appends new entries,
#             never overwrites)
# READ BY:    /create-stories (embed IDs in stories as **Requirement**)
#             /story-readiness (validate TR-ID exists and is active)
#             /dev-story (implement against the current requirement text)
#             /story-done (look up current requirement text at review time)
#
# ID FORMAT: TR-[feature-slug]-[NNN]
#   feature-slug = the PRD stem (design/prd/goals.md -> goals); the same slug is
#                  the feature_overrides key and the story's **PRD** field
#   NNN = three-digit zero-padded sequence per feature, starting at 001
#
# FIELDS:
#   id            TR-[feature-slug]-[NNN]
#   feature       feature slug
#   prd           owning PRD path (design/prd/<feature-slug>.md)
#   requirement   one-line requirement text, as the PRD states it
#   type          functional | nfr  (optional; functional = from
#                 ## Functional Requirements or ## Business Rules & Calculations,
#                 nfr = from ## Non-Functional Requirements)
#   nfr_category  optional, nfr only: performance | availability | security |
#                 privacy | accessibility | localization
#   created       YYYY-MM-DD
#   revised       YYYY-MM-DD or ""
#   status        see STATUS VALUES
#
# STATUS VALUES: active | deprecated | "superseded-by: TR-[feature-slug]-NNN"
#   Quote the superseded-by value: an unquoted second colon is not valid YAML.

version: 1
last_updated: ""

requirements: []

