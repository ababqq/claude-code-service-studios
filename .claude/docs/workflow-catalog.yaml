# Workflow Catalog
# Read by .claude/scripts/artifact-check.sh on behalf of /help, /gate-check and
# /project-stage-detect to determine where a project is and what comes next.
#
# Artifact checks:
#   glob: file glob pattern — complete if >=1 file matches (or min_count)
#   pattern: POSIX ERE (grep -E) that must appear in a matched file
#   min_count: minimum matching files required (default: 1)
#   note: human-readable fallback when completion can't be auto-detected
#   any_of: list of alternative {glob, pattern} specs — complete if ANY matches.
#           Used for tier alternatives (product brief vs one-pager), for audit
#           modes (full vs quick) and for API styles (OpenAPI, GraphQL, ...).
#
# required: true  -> shown as REQUIRED (blocks progression)
# required: false -> shown as OPTIONAL
# required_tiers: [..] -> the modes.workflow tiers at which a required step is
#           required. Absent = every tier. Printed as tiers=...
# required_when: <condition> -> the step is required only when the condition
#           holds: ui | backend | pii | stores | multi-locale. Absent = always.
#           Printed as when=...
# /help and /project-stage-detect render a required step as OPTIONAL when the
# resolved tier is not listed or the condition is known to be false; an unknown
# condition counts as true (unset is not false). /gate-check never uses these
# two fields for verdicts — its gate reference file is authoritative.
# repeatable: true -> runs multiple times (one per feature, story, release...)
# Step ids may repeat across phases (the same skill serves several phases).
#
# FORMAT CONTRACT (hand-written parser in artifact-check.sh — never run a YAML
# formatter over this file): phases col 0; phase ids 2 spaces; phase fields 4;
# "- id:" 6; step fields 8; artifact fields 10; any_of "- glob:" 12 and its
# "pattern:" 14. Block style only; required_tiers is the one flow-style list.
#
# Phase gates (/gate-check): verdicts are ADVISORY — they guide the decision
# but never hard-block advancement. The user always decides whether to proceed.

phases:

  discovery:
    label: "Discovery"
    description: "Frame the problem, the users and the bet; pin the stack layers already decided"
    next_phase: definition
    steps:
      - id: brainstorm
        name: "Product Discovery"
        command: /brainstorm
        required: false
        description: "Explore the problem space: jobs-to-be-done, target users, alternatives, value proposition, business-model hypothesis"

      - id: product-brief
        name: "Product Brief"
        command: /brainstorm
        required: true
        artifact:
          any_of:
            - glob: "design/product/product-brief.md"
            - glob: "design/product/one-pager.md"
        description: "Formalize the bet: problem, users and JTBD, value proposition, product principles, success metrics, riskiest assumptions, MVP scope. /brainstorm writes the one-pager at minimal and the brief at standard/full; the gate applies the tier."

      - id: prd-review-brief
        name: "Brief Review"
        command: /prd-review
        required: true
        required_tiers: [standard, full]
        artifact:
          glob: "design/product/reviews/*-review-log.md"
        description: "Validate the product brief before decomposing it into features. The Discovery → Definition gate requires this review at standard/full (latest verdict not MAJOR REVISION NEEDED); not needed at minimal."

      - id: stack-setup
        name: "Stack Setup"
        command: /setup-stack
        required: false
        artifact:
          glob: "project.yaml"
          pattern: "^[[:space:]]+pinned_on:[[:space:]]*.?[0-9]{4}-[0-9]{2}-[0-9]{2}"
        description: "Choose the stack layers already decided (usually web/mobile/backend frameworks), pin versions from live sources, declare code roots, naming and commands. Data and cloud layers may wait for their ADRs (/setup-stack refresh records them). Recommended here; the Definition → Architecture gate requires the pin at standard/full and the Architecture → Validation gate at every tier (the stack-setup steps of those phases)."

      - id: prototype
        name: "Concept Prototype"
        command: /prototype
        required: false
        artifact:
          glob: "prototypes/*-concept/REPORT.md"
        description: "Test the riskiest assumption cheaply (clickable, fake-door, concierge or code spike) before writing PRDs. PROCEED / PIVOT / KILL."

  definition:
    label: "Definition"
    description: "Decompose the product into features and specify each MVP feature in a PRD"
    next_phase: architecture
    steps:
      - id: map-features
        name: "Feature Map"
        command: /map-features
        required: true
        required_tiers: [standard, full]
        artifact:
          glob: "design/product/feature-map.md"
        description: "Decompose the brief into features with dependency order and MVP / Beta / GA / Later tiers"

      - id: write-prd
        name: "Feature PRDs"
        command: /write-prd
        required: true
        repeatable: true
        required_tiers: [standard, full]
        artifact:
          glob: "design/prd/*.md"
          min_count: 1
        description: "Author one PRD per MVP feature, section by section. Each MVP feature needs Status: Approved in the feature map."

      - id: prd-review
        name: "PRD Review"
        command: /prd-review
        required: true
        repeatable: true
        required_tiers: [standard, full]
        artifact:
          glob: "design/prd/reviews/*-review-log.md"
        description: "Validate each PRD (required sections per workflow tier, no MAJOR REVISION NEEDED). Run per PRD."

      - id: review-all-prds
        name: "Cross-PRD Review"
        command: /review-all-prds
        required: true
        required_tiers: [full]
        artifact:
          glob: "design/prd/reviews/prd-cross-review-*.md"
        description: "Holistic consistency and product-theory review across all PRDs (recommended at standard)"

      - id: stack-setup
        name: "Stack Pinned"
        command: /setup-stack
        required: true
        required_tiers: [standard, full]
        artifact:
          glob: "project.yaml"
          pattern: "^[[:space:]]+pinned_on:[[:space:]]*.?[0-9]{4}-[0-9]{2}-[0-9]{2}"
        description: "The Definition → Architecture gate requires stack.pinned_on at standard/full (only configured layers count; data and cloud may wait for their Foundation ADRs). Already PRESENT when the stack was pinned in Discovery."

      - id: user-journey
        name: "User Journey Map"
        command: /ux-design
        required: false
        artifact:
          glob: "design/product/user-journey.md"
        description: "Run `/ux-design journey`: lifecycle stages from acquisition to retention, with moments of value and drop-off risks"

      - id: consistency-check
        name: "Consistency Check"
        command: /consistency-check
        required: false
        repeatable: true
        description: "Scan PRDs against the glossary registry for contradictions. Re-run whenever a PRD is added or revised."

  architecture:
    label: "Architecture"
    description: "Architecture, decisions, initial API contract, data model, security and accessibility foundations, test and CI scaffold"
    next_phase: validation
    steps:
      - id: create-architecture
        name: "Architecture Document & SLOs"
        command: /create-architecture
        required: true
        required_tiers: [standard, full]
        artifact:
          glob: "docs/architecture/architecture.md"
        description: "Author the architecture blueprint (layers, deployment topology and environments, data flow, observability) and docs/ops/slo.md (critical user journeys and their SLOs)"

      - id: architecture-decision
        name: "Architecture Decisions (ADRs)"
        command: /architecture-decision
        required: true
        repeatable: true
        required_tiers: [standard, full]
        artifact:
          glob: "docs/architecture/adr-*.md"
          min_count: 1
        description: "Record key decisions as ADRs. Full: at least 3 Foundation-layer ADRs (identity/auth, primary data store, API style, deployment topology, observability) — the gate enforces the count. Standard: critical ADRs only."

      - id: api-design
        name: "API Contract (initial)"
        command: /api-design
        required: true
        repeatable: true
        required_tiers: [standard, full]
        required_when: backend
        artifact:
          any_of:
            - glob: "docs/api/openapi*.yaml"
            - glob: "docs/api/openapi*.json"
            - glob: "docs/api/*.graphql"
            - glob: "docs/api/*.proto"
            - glob: "docs/api/asyncapi*.yaml"
        description: "Contract-first API design (OpenAPI 3.1 by default). The initial contract covers Foundation/Core resources (auth/session, account, the core domain entity); screen-driven operations are reconciled in Validation."

      - id: data-model
        name: "Data Model"
        command: /data-model
        required: true
        required_tiers: [standard, full]
        required_when: backend
        artifact:
          glob: "docs/data/data-model.md"
        description: "Entities, ownership, data classification (PII), retention, indexes, and the expand/contract migration strategy"

      - id: threat-model
        name: "Threat Model"
        command: /security-audit
        required: true
        required_tiers: [standard, full]
        required_when: pii
        artifact:
          glob: "docs/security/threat-model.md"
        description: "Run `/security-audit threat-model` (STRIDE per trust boundary). Recommended even without personal data."

      - id: architecture-review
        name: "Architecture Review"
        command: /architecture-review
        required: true
        required_tiers: [standard, full]
        artifact:
          glob: "docs/architecture/architecture-review-*.md"
        description: "Validate PRD-to-ADR traceability, cross-ADR conflicts, stack compatibility"

      - id: accessibility-doc
        name: "Accessibility Requirements"
        command: /ux-design
        required: true
        required_tiers: [standard, full]
        required_when: ui
        artifact:
          glob: "design/accessibility-requirements.md"
        description: "Run `/ux-design accessibility`. Commits accessibility.target (WCAG 2.2 level) plus regional standards from compliance.regions."

      - id: test-setup
        name: "Test Framework & CI"
        command: /test-setup
        required: true
        required_tiers: [standard, full]
        artifact:
          any_of:
            - glob: ".github/workflows/*.yml"
            - glob: ".github/workflows/*.yaml"
            - glob: ".gitlab-ci.yml"
            - glob: "bitbucket-pipelines.yml"
            - glob: "azure-pipelines.yml"
        description: "Scaffold unit/integration/contract/E2E test runners per layer and the CI workflow, once, before Validation (Sprint 0 scaffold)"

      - id: stack-setup
        name: "Stack Pinned (VERSION.md complete)"
        command: /setup-stack
        required: true
        artifact:
          glob: "project.yaml"
          pattern: "^[[:space:]]+pinned_on:[[:space:]]*.?[0-9]{4}-[0-9]{2}-[0-9]{2}"
        description: "The Architecture → Validation gate requires stack.pinned_on and a docs/stack-reference/VERSION.md Pinned Components row for every configured component at every tier (the minimal floor); run `/setup-stack refresh` once the data and cloud ADRs are Accepted."

  validation:
    label: "Validation"
    description: "Specify key screens, reconcile the API with them, prove the path end to end on staging, and plan the first sprint"
    next_phase: build
    steps:
      - id: ui-inventory
        name: "Screen & Media Inventory"
        command: /ui-inventory
        required: false
        artifact:
          glob: "design/inventory/screen-inventory.md"
        description: "Enumerate routes/screens per surface, shared components and media assets. Source of truth for UX spec coverage."

      - id: design-language
        name: "Design Language"
        command: /design-language
        required: true
        required_tiers: [standard, full]
        required_when: ui
        artifact:
          glob: "design/brand/design-language.md"
        description: "Author the design language (9 sections). Full: all sections. Standard: sections 1-5 (the gate applies this)."

      - id: ux-design
        name: "UX Specs (key screens)"
        command: /ux-design
        required: true
        repeatable: true
        required_tiers: [standard, full]
        required_when: ui
        artifact:
          glob: "design/ux/*.md"
          min_count: 3
        description: "Specs for sign-up/sign-in, onboarding, the core flow, settings/account, plus the app shell (`/ux-design shell`) and interaction patterns (`/ux-design patterns`)"

      - id: ux-review
        name: "UX Review"
        command: /ux-review
        required: true
        required_tiers: [standard, full]
        required_when: ui
        artifact:
          glob: "design/ux/reviews/*-ux-review-*.md"
        description: "Validate key UX specs against PRDs, the design language and the accessibility target"

      - id: usability-prototype
        name: "Usability Test (prototype)"
        command: /usability-report
        required: false
        repeatable: true
        artifact:
          glob: "production/qa/usability/*.md"
        description: "Test the core flow with 3-5 target users on a clickable prototype or the walking skeleton"

      - id: api-design
        name: "API Contract Update (from UX specs)"
        command: /api-design
        required: true
        repeatable: true
        required_tiers: [full]
        required_when: backend
        artifact:
          glob: "docs/api/changes/api-change-*.md"
        description: "Run `/api-design reconcile`: reconcile the contract with the key UX specs (screen-driven operations, pagination, aggregation endpoints) before epics. The Validation → Build gate requires the reconcile record (`> **Mode**: reconcile`) at full when the product has both a backend and a UI (recommended at standard). The catalog condition names backend only; with no UI surface the gate reports the item N/A."

      - id: control-manifest
        name: "Control Manifest"
        command: /create-control-manifest
        required: true
        required_tiers: [full]
        artifact:
          glob: "docs/architecture/control-manifest.md"
        description: "Flat engineer rules sheet generated from Accepted ADRs and the tech radar (recommended at standard)"

      - id: create-epics
        name: "Create Epics"
        command: /create-epics
        required: true
        repeatable: true
        required_tiers: [standard, full]
        artifact:
          glob: "production/epics/*/EPIC.md"
        description: "Translate PRDs + ADRs + API contract into epics, one per architectural module. Run per layer: foundation, then core."

      - id: create-stories
        name: "Create Stories"
        command: /create-stories
        required: true
        repeatable: true
        required_tiers: [standard, full]
        artifact:
          glob: "production/epics/*/story-*.md"
        description: "Break each epic into implementable stories. Run per epic: /create-stories [epic-slug]"

      - id: sprint-plan
        name: "First Sprint Plan"
        command: /sprint-plan
        required: true
        required_tiers: [standard, full]
        artifact:
          glob: "production/sprints/sprint-*.md"
        description: "Plan the first sprint with prioritized, ready stories"

      - id: walking-skeleton
        name: "Walking Skeleton"
        command: /walking-skeleton
        required: true
        required_tiers: [standard, full]
        artifact:
          glob: "production/walking-skeleton/report-*.md"
        description: "Real, thin end-to-end path (UI -> API -> DB -> observability) deployed to staging through CI/CD, with a rehearsed rollback and a flag toggled without a deploy. If built at minimal, it must pass its validation items."

  build:
    label: "Build"
    description: "Sprint-based delivery — pick, implement, verify, close stories"
    next_phase: hardening
    steps:
      - id: sprint-plan
        name: "Sprint Plan"
        command: /sprint-plan
        required: true
        repeatable: true
        required_tiers: [standard, full]
        artifact:
          glob: "production/sprints/sprint-*.md"
        description: "Plan the current sprint. At minimal the one-pager's Build Order is the plan."

      - id: story-readiness
        name: "Story Readiness Check"
        command: /story-readiness
        required: false
        repeatable: true
        description: "Validate a story is implementation-ready before an engineer picks it up"

      - id: implement
        name: "Implement Stories"
        command: /dev-story
        required: true
        repeatable: true
        required_tiers: [standard, full]
        artifact:
          glob: "production/sprint-status.yaml"
          pattern: "^[[:space:]]+status:[[:space:]]*(in-progress|review|done)"
        description: "Pick the next ready story and implement it with /dev-story [story-path]. Routes to the engineer for the story's Surface and Type."

      - id: code-review
        name: "Code Review"
        command: /code-review
        required: false
        repeatable: true
        description: "Architectural code review after each story, before /story-done (at lean/solo /story-done runs the checklist inline)"

      - id: story-done
        name: "Story Done Review"
        command: /story-done
        required: true
        repeatable: true
        required_tiers: [standard, full]
        artifact:
          glob: "production/sprint-status.yaml"
          pattern: "^[[:space:]]+status:[[:space:]]*done"
        description: "Verify acceptance criteria and evidence, check PRD/ADR/API-contract deviations, close the story"

      - id: smoke-check
        name: "Smoke Check"
        command: /smoke-check
        required: true
        repeatable: true
        artifact:
          glob: "production/qa/smoke-*.md"
        description: "Run the critical-path smoke suite before QA hand-off. The smoke report is the floor at every tier."

      - id: qa-plan
        name: "QA Plan"
        command: /qa-plan
        required: false
        repeatable: true
        artifact:
          glob: "production/qa/qa-plan-*.md"
        description: "QA test plan per sprint or feature"

      - id: bug-report
        name: "Bug Report / Triage"
        command: /bug-report
        required: false
        repeatable: true
        description: "Log and prioritize bugs. /bug-report creates a report; /bug-triage prioritizes the open backlog."

      - id: ux-design
        name: "UX Spec (new or changed screens)"
        command: /ux-design
        required: false
        repeatable: true
        artifact:
          glob: "design/ux/*.md"
        description: "Spec every screen added or changed after Validation before it is implemented"

      - id: retrospective
        name: "Sprint Retrospective"
        command: /retrospective
        required: false
        repeatable: true
        artifact:
          glob: "production/retrospectives/retro-*.md"
        description: "Capture what worked and what to change at the end of each sprint"

      - id: team-orchestration
        name: "Team Orchestration (optional)"
        required: false
        repeatable: true
        description: "Coordinate several agents on one piece of work: /team-feature, /team-ui, /team-content, /team-qa"

      - id: scope-check
        name: "Scope Check"
        command: /scope-check
        required: false
        repeatable: true
        description: "Detect scope creep against the PRD Goals & Non-Goals and the one-pager. Run when stories are added mid-sprint or before retrospectives."

      - id: sprint-status
        name: "Sprint Status"
        command: /sprint-status
        required: false
        repeatable: true
        description: "Quick 30-line snapshot of sprint progress"

  hardening:
    label: "Hardening"
    description: "Stabilize for launch — performance, load, security, accessibility, usability, QA sign-off, runbooks; prepare the release"
    next_phase: launch
    steps:
      - id: team-hardening
        name: "Hardening Team Pass"
        command: /team-hardening
        required: true
        required_tiers: [standard, full]
        artifact:
          glob: "production/qa/hardening-*.md"
        description: "Coordinated pass across performance, reliability, security, accessibility, UI consistency and regression"

      - id: perf-profile
        name: "Performance Profile"
        command: /perf-profile
        required: false
        repeatable: true
        artifact:
          glob: "production/qa/perf/perf-profile-*.md"
        description: "Measure against performance.* budgets: Core Web Vitals, API latency, mobile cold start"

      - id: bundle-audit
        name: "Bundle & Asset Audit"
        command: /bundle-audit
        required: false
        artifact:
          glob: "production/qa/perf/bundle-audit-*.md"
        description: "Per-route JS/CSS, images, fonts (incl. Korean font subsetting) and mobile app size"

      - id: load-test
        name: "Load Test"
        command: /load-test
        required: true
        required_tiers: [full]
        artifact:
          glob: "production/qa/load/load-test-*.md"
        description: "Load / stress / spike / soak against staging with thresholds from performance.* (recommended at standard)"

      - id: security-audit
        name: "Security & Privacy Audit"
        command: /security-audit
        required: true
        artifact:
          any_of:
            - glob: "production/security/security-audit-full-*.md"
            - glob: "production/security/security-audit-quick-*.md"
        description: "Mode full at standard/full (the gate enforces the mode); quick (secrets + dependencies + headers) suffices at minimal"

      - id: usability
        name: "Usability / Beta Sessions"
        command: /usability-report
        required: true
        repeatable: true
        required_tiers: [standard, full]
        artifact:
          glob: "production/qa/usability/*.md"
          min_count: 1
        description: "Sessions covering first-run, core journey and returning use (or a beta readout). Full: 3 sessions (the gate enforces the count); standard: at least one."

      - id: business-rules-check
        name: "Business Rules Check"
        command: /business-rules-check
        required: false
        artifact:
          glob: "production/qa/business-rules/business-rules-check-*.md"
        description: "Pricing, limits, fees, promotions and abuse vectors are consistent and safe"

      - id: feature-audit
        name: "Feature Audit"
        command: /feature-audit
        required: false
        artifact:
          glob: "production/qa/feature-audit-*.md"
        description: "Planned (PRDs, screens, endpoints, events, flags) versus implemented"

      - id: team-qa
        name: "QA Cycle & Sign-off"
        command: /team-qa
        required: true
        required_tiers: [standard, full]
        artifact:
          glob: "production/qa/qa-signoff-*.md"
        description: "Full QA cycle ending in a sign-off verdict; the sign-off is an exit criterion of Hardening (checked by the launch gate)"

      - id: runbooks
        name: "Runbooks"
        command: /incident
        required: true
        repeatable: true
        required_tiers: [standard, full]
        artifact:
          glob: "docs/ops/runbooks/*.md"
        description: "Run `/incident runbook <alert-slug>` for every paging alert named in docs/ops/slo.md"

      - id: localize-qa
        name: "Localization QA"
        command: /localize
        required: true
        required_tiers: [standard, full]
        required_when: multi-locale
        artifact:
          glob: "production/qa/localization-qa-*.md"
        description: "Run `/localize qa` when more than one locale ships (localization.locales)"

      - id: changelog
        name: "Changelog (release version)"
        command: /changelog
        required: true
        repeatable: true
        required_tiers: [standard, full]
        artifact:
          glob: "docs/CHANGELOG.md"
          pattern: "^## [[][0-9]"
        description: "Run `/changelog <version>` to write the release's `## [<version>]` section in docs/CHANGELOG.md — /release-notes builds from that section and stops BLOCKED without it"

      - id: release-notes
        name: "Release Notes (draft)"
        command: /release-notes
        required: true
        repeatable: true
        required_tiers: [standard, full]
        artifact:
          glob: "production/releases/*/release-notes.md"
        description: "Draft customer-facing notes per channel (in-app/web, App Store, Google Play) before submission, from the `## [<version>]` section the changelog step wrote."

      - id: smoke-check
        name: "Release-Candidate Smoke Check"
        command: /smoke-check
        required: true
        repeatable: true
        artifact:
          glob: "production/qa/smoke-*.md"
          pattern: "^> [*][*]Verdict[*][*]: PASS[[:space:]]*$"
        description: "Smoke the release candidate build before the release checklist. The Hardening → Launch gate requires a strict PASS at every tier — PASS WITH WARNINGS does not satisfy it. The pattern finds a PASS report but not which build it covered: check its **Build under test** line."

      - id: release-checklist
        name: "Release Checklist"
        command: /release-checklist
        required: true
        repeatable: true
        artifact:
          glob: "production/releases/*/release-checklist.md"
        description: "Per-release readiness: build, migrations, flags, config/secrets, observability, rollback path, store block. Needs the release-candidate smoke-check PASS above first."

      - id: rollout-plan
        name: "Rollout Plan"
        command: /rollout-plan
        required: true
        repeatable: true
        required_tiers: [standard, full]
        artifact:
          glob: "production/releases/*/rollout-plan.md"
        description: "Staged rollout with flags/canary stages, guardrail metrics, halt thresholds and rollback per stage; includes the SRE production readiness review"

      - id: launch-checklist
        name: "Launch Checklist"
        command: /launch-checklist
        required: true
        required_tiers: [standard, full]
        artifact:
          glob: "production/releases/*/launch-checklist.md"
        description: "GA readiness across product, engineering/SRE, security & privacy, legal, support and go-to-market"

  launch:
    label: "Launch"
    description: "Ship, operate and keep delivering — each release repeats checklist -> rollout plan -> release record. Terminal phase: no further gate."
    next_phase: null
    steps:
      - id: team-release
        name: "Release Execution"
        command: /team-release
        required: true
        repeatable: true
        artifact:
          glob: "production/releases/*/release-record.md"
        description: "Execute the release train and rollout plan; record what shipped and every rollout stage"

      - id: release-notes
        name: "Release Notes"
        command: /release-notes
        required: false
        repeatable: true
        artifact:
          glob: "production/releases/*/release-notes.md"
        description: "Customer-facing notes per channel for each subsequent release (run `/changelog <version>` first)"

      - id: changelog
        name: "Changelog"
        command: /changelog
        required: false
        repeatable: true
        artifact:
          glob: "docs/CHANGELOG.md"
        description: "Keep-a-Changelog history from commits and sprint records"

      - id: incident
        name: "Incident Response"
        command: /incident
        required: false
        repeatable: true
        artifact:
          glob: "production/incidents/INC-*.md"
        description: "Only when production breaks: SEV classification, mitigation, comms, timeline"

      - id: postmortem
        name: "Blameless Postmortem"
        command: /postmortem
